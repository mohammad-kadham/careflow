name: CareFlow CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CareFlow
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            CareFlow/package-lock.json
            CareFlow/backend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Backend tests
        run: npm run test:backend
      - name: Deployment safety tests
        run: |
          bash -n deploy/receive.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Production build
        env:
          VITE_API_URL: /api
        run: npm run build
      - name: Package tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p release/backend
          git -C "$GITHUB_WORKSPACE" archive "$GITHUB_SHA:CareFlow/backend" | tar -x -C release/backend
          rm -f release/backend/.env.example release/backend/.gitignore
          cp -R dist release/dist
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          printf '%s\n' "$GITHUB_SHA" > release/dist/version.txt
          tar -czf release.tar.gz -C release .
          python3 deploy/validate-release.py release.tar.gz
      - name: Save deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: CareFlow/release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: careflow-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Skip a superseded revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; skipping this deployment.'
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.revision.outputs.deploy == 'true'
        with:
          name: production-release
      - name: Deploy tested artifact
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" < release.tar.gz
      - name: Verify public deployment
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          set -euo pipefail
          : "${DEPLOY_URL:?Missing DEPLOY_URL}"
          test "$(curl --fail --silent --show-error --retry 3 --max-time 20 "$DEPLOY_URL/version.txt")" = "$GITHUB_SHA"
          curl --fail --silent --show-error --retry 3 --max-time 20 "$DEPLOY_URL/" -o /dev/null
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$DEPLOY_URL/api/user/me")" = 401
          curl --fail --silent --show-error --retry 3 --max-time 20 "$DEPLOY_URL/admin/" -o /dev/null
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$DEPLOY_URL/api/admin/me")" = 401
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$DEPLOY_URL/api/admin/payments")" = 401
          echo 'Production revision, admin access protection and HTTPS checks passed.'